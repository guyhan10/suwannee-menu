name: Update Suwannee menu

on:
  schedule:
    - cron: "17 9 * * *"   # ~4:17 AM Eastern
    - cron: "17 15 * * *"  # ~10:17 AM Eastern (refresh in case the menu changed)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs
      - name: Commit menu
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu
          git diff --cached --quiet || git commit -m "Menu update $(date +%F)"
          git push
